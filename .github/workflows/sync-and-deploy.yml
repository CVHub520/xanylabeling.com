name: Sync and Deploy Product Content

on:
  repository_dispatch:
    types:
      - product-content-updated
  workflow_dispatch:
    inputs:
      product_id:
        description: Product content source
        required: true
        type: choice
        options:
          - x-anylabeling
          - server
      source_sha:
        description: Full 40-character source commit SHA
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: website-production-content-sync
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  OSSUTIL_VERSION: "2.3.0"
  OSSUTIL_ARCHIVE: ossutil-2.3.0-linux-amd64.zip
  OSSUTIL_SHA256: 3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a

jobs:
  sync-and-deploy:
    name: Sync, validate, and deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out website source
        uses: actions/checkout@v6

      - name: Resolve content update
        id: source
        env:
          DISPATCH_PRODUCT_ID: ${{ github.event.client_payload.product_id }}
          DISPATCH_REPOSITORY: ${{ github.event.client_payload.repository }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          MANUAL_PRODUCT_ID: ${{ inputs.product_id }}
          MANUAL_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          product_id="${DISPATCH_PRODUCT_ID:-${MANUAL_PRODUCT_ID:-}}"
          source_sha="${DISPATCH_SHA:-${MANUAL_SHA:-}}"
          source_repository="${DISPATCH_REPOSITORY:-}"
          if [[ -z "${product_id}" || -z "${source_sha}" ]]; then
            echo "Missing product ID or source SHA" >&2
            exit 1
          fi
          echo "product_id=${product_id}" >> "${GITHUB_OUTPUT}"
          echo "repository=${source_repository}" >> "${GITHUB_OUTPUT}"
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Update content lock
        env:
          PRODUCT_ID: ${{ steps.source.outputs.product_id }}
          SOURCE_REPOSITORY: ${{ steps.source.outputs.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node scripts/content/update-lock.mjs \
            "${PRODUCT_ID}" \
            "${SOURCE_SHA}" \
            "${SOURCE_REPOSITORY}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check locked content
        env:
          CONTENT_SOURCE_MODE: locked
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run typecheck

      - name: Build locked content
        env:
          CONTENT_SOURCE_MODE: locked
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Verify production build
        run: |
          set -euo pipefail
          test -f build/index.html
          test -f build/zh-Hans/index.html
          test -f build/docs/x-anylabeling/get_started/index.html
          test -f build/zh-Hans/docs/x-anylabeling/get_started/index.html
          file_count=$(find build -type f | wc -l)
          if (( file_count < 100 )); then
            echo "Unexpectedly small production build: ${file_count} files" >&2
            exit 1
          fi
          git diff --check

      - name: Commit content lock
        env:
          PRODUCT_ID: ${{ steps.source.outputs.product_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- content/content.lock.json; then
            echo "Content lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/content.lock.json
          git commit -m "📚 docs(content): sync ${PRODUCT_ID} to ${SOURCE_SHA:0:7}"
          git push

      - name: Install ossutil
        run: |
          set -euo pipefail
          curl -fsSLO \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/${OSSUTIL_ARCHIVE}"
          echo "${OSSUTIL_SHA256}  ${OSSUTIL_ARCHIVE}" | sha256sum -c -
          unzip -q "${OSSUTIL_ARCHIVE}"
          sudo install -m 0755 \
            "ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" \
            /usr/local/bin/ossutil
          ossutil version

      - name: Preview OSS synchronization
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
        run: |
          set -euo pipefail
          ossutil sync \
            build/ \
            "oss://${OSS_BUCKET}/" \
            --delete \
            --dry-run \
            --force

      - name: Deploy to Alibaba Cloud OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
        run: |
          set -euo pipefail
          ossutil sync \
            build/ \
            "oss://${OSS_BUCKET}/" \
            --delete \
            --force

      - name: Verify live website
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --output /dev/null \
            "https://xanylabeling.com/"
          curl -fsSL --retry 5 --retry-all-errors --output /dev/null \
            "https://xanylabeling.com/zh-Hans/"
          curl -fsSL --retry 5 --retry-all-errors --output /dev/null \
            "https://xanylabeling.com/docs/x-anylabeling/get_started/"
